services:

  docker-vscode-customized:
    build: ./
    image: ghcr.io/firefly2442/docker-vscode-customized:latest
    hostname: docker-vscode-customized
    ports:
      - "8443:8443" # vscode
      - "8060:8060" # for godot web editor
    restart: unless-stopped
